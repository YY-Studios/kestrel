[project]
name = "kestrel-api"
version = "0.1.0"
description = "Kestrel API 서버 (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "supabase>=2.9",
    "kis-client",
]

[tool.uv]
package = false

[tool.uv.sources]
kis-client = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

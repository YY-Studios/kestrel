[project]
name = "kestrel-engine"
version = "0.1.0"
description = "Kestrel 매매 엔진 워커 (조건 감시 · 주문)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "supabase>=2.9",
    "kis-client",
]

[tool.uv]
package = false

[tool.uv.sources]
kis-client = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]
